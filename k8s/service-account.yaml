apiVersion: v1
kind: ServiceAccount
metadata:
  name: billing-service-sa
  namespace: billing-service
  annotations:
    # EKS IRSA (IAM Roles for Service Accounts)
    # This role ARN is substituted by sed during CD pipeline
    # Value comes from: terraform output billing_service_irsa_role_arn (when added to infra-database)
    eks.amazonaws.com/role-arn: "__IRSA_ROLE_ARN__"
---
# NOTE: IAM Policy is managed via Terraform (e.g. fiap-techchallenge-infra-database or Billing's terraform)
#
# The IRSA role should include permissions for:
# - DynamoDB: GetItem, PutItem, UpdateItem, DeleteItem, Query, BatchGetItem, etc.
# - SQS: SendMessage, ReceiveMessage, DeleteMessage, GetQueueUrl, GetQueueAttributes
# - ECR: GetAuthorizationToken, BatchCheckLayerAvailability, GetDownloadUrlForLayer, BatchGetImage
#
# To apply manually, replace the placeholder:
# kubectl apply -f - <<EOF
# apiVersion: v1
# kind: ServiceAccount
# metadata:
#   name: billing-service-sa
#   namespace: billing-service
#   annotations:
#     eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT:role/billing-service-role"
# EOF
