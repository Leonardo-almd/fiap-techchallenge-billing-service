apiVersion: v1
kind: Secret
metadata:
  name: billing-service-secrets
  namespace: billing-service
type: Opaque
data:
  # ==============================================================================
  # BILLING SERVICE SECRETS
  # ==============================================================================
  # Billing uses DynamoDB (no DB credentials needed) and IRSA for AWS auth.
  # This secret holds a placeholder so the secretRef in the Deployment is valid.
  # Values are populated by the CD pipeline.
  _PLACEHOLDER: __PLACEHOLDER_B64__
  
  # ==============================================================================
  # NOTE: AWS CREDENTIALS NOT NEEDED HERE
  # ==============================================================================
  # The pod uses IRSA (IAM Roles for Service Accounts) for AWS authentication.
  # The ServiceAccount is annotated with the IAM role ARN, and the pod
  # automatically receives temporary credentials via the EKS OIDC provider.
  # See: k8s/service-account.yaml
