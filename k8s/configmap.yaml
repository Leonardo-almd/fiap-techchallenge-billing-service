apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-service-config
  namespace: billing-service
data:
  # Server Configuration (aligned with OS Service pattern)
  SERVER_PORT: "8080"
  SERVER_SERVLET_CONTEXT_PATH: "/api/billing-service"
  
  # AWS Configuration
  AWS_REGION: "us-east-1"
  
  # DynamoDB Table Names (substituted by CD pipeline from Terraform outputs)
  DYNAMODB_TABLE_BUDGETS: "__DYNAMODB_TABLE_BUDGETS__"
  DYNAMODB_TABLE_PAYMENTS: "__DYNAMODB_TABLE_PAYMENTS__"
  
  # SQS Queue Names (substituted by CD pipeline from Terraform outputs)
  SQS_QUEUE_SERVICE_ORDER_EVENTS: "__SQS_QUEUE_SERVICE_ORDER_EVENTS__"
  SQS_QUEUE_BILLING_EVENTS: "__SQS_QUEUE_BILLING_EVENTS__"
  SQS_QUEUE_QUOTE_APPROVED: "__SQS_QUEUE_QUOTE_APPROVED__"
  SQS_QUEUE_PAYMENT_FAILED: "__SQS_QUEUE_PAYMENT_FAILED__"
  
  # Spring Configuration
  SPRING_PROFILES_ACTIVE: "production"
  
  # Actuator Configuration
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
