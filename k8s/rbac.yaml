apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: billing-service-role
  namespace: billing-service
  labels:
    app: billing-service
rules:
  # Permitir leitura de ConfigMaps
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  
  # Permitir leitura de Secrets
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  
  # Permitir leitura de Services
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
  
  # Permitir leitura de Pods (para service discovery)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: billing-service-rolebinding
  namespace: billing-service
  labels:
    app: billing-service
subjects:
  - kind: ServiceAccount
    name: billing-service-sa
    namespace: billing-service
roleRef:
  kind: Role
  name: billing-service-role
  apiGroup: rbac.authorization.k8s.io
