apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: billing-service-ingress
  namespace: billing-service
  labels:
    app: billing-service
  annotations:
    # AWS Load Balancer Controller
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    
    # Certificate Manager
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:123456789012:certificate/your-certificate-id
    
    # Health Check
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
    
    # Tags
    alb.ingress.kubernetes.io/tags: Environment=production,Team=backend,Service=billing
    
    # CORS (se necessário)
    # nginx.ingress.kubernetes.io/enable-cors: "true"
    # nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    
    # Rate Limiting (se usar NGINX Ingress)
    # nginx.ingress.kubernetes.io/limit-rps: "100"
spec:
  rules:
  - host: billing.car-garage.example.com
    http:
      paths:
      - path: /api/v1/budgets
        pathType: Prefix
        backend:
          service:
            name: billing-service
            port:
              number: 80
      
      - path: /api/v1/payments
        pathType: Prefix
        backend:
          service:
            name: billing-service
            port:
              number: 80
      
      - path: /actuator
        pathType: Prefix
        backend:
          service:
            name: billing-service
            port:
              number: 80
      
      - path: /api/v1/swagger-ui
        pathType: Prefix
        backend:
          service:
            name: billing-service
            port:
              number: 80
  
  # TLS Configuration
  tls:
  - hosts:
    - billing.car-garage.example.com
    secretName: billing-service-tls
---
# Alternativa para NGINX Ingress Controller
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: billing-service-ingress-nginx
  namespace: billing-service
  labels:
    app: billing-service
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # Rate Limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    
    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    
    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  rules:
  - host: billing.car-garage.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: billing-service
            port:
              number: 80
  
  tls:
  - hosts:
    - billing.car-garage.example.com
    secretName: billing-service-tls
