apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: billing-service
  labels:
    app: billing-service
spec:
  # Single replica for cost optimization (educational environment); use HPA for scaling
  replicas: 1
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      serviceAccountName: billing-service-sa
      containers:
        - name: billing-service
          image: __IMAGE_URI__
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: billing-service-config
            - secretRef:
                name: billing-service-secrets
          # Resources: 384Mi request so Spring Boot has room to start; aligned with t3.small
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"
          # Startup: Spring Boot can take 2–5 min on small resources; allow up to 10 min
          startupProbe:
            httpGet:
              path: /api/billing-service/actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          # Readiness: give time for app to finish init (DynamoDB/SQS, etc.)
          readinessProbe:
            httpGet:
              path: /api/billing-service/actuator/health/readiness
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          # Liveness: only after app has had time to start
          livenessProbe:
            httpGet:
              path: /api/billing-service/actuator/health/liveness
              port: 8080
            initialDelaySeconds: 180
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - billing-service
                topologyKey: kubernetes.io/hostname
