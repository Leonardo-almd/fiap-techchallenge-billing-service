name: CD Pipeline

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  JAVA_VERSION: '21'
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cargarage-app
  EKS_CLUSTER_NAME: cargarage-eks-prod
  TF_CLOUD_ORGANIZATION: fiap-soat-techchallenge
  TF_WORKSPACE: fiap-techchallenge-infra-database

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      image-tag: ${{ steps.version.outputs.version }}
      image-uri: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Extract version from POM
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${VERSION}"

      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} --output text 2>/dev/null || \
          aws ecr create-repository --repository-name ${{ env.ECR_REPOSITORY }} --image-scanning-configuration scanOnPush=true

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.version.outputs.version }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch and parse Terraform outputs
        id: parsed-outputs
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          TF_ORG: ${{ env.TF_CLOUD_ORGANIZATION }}
          TF_WORKSPACE: ${{ env.TF_WORKSPACE }}
        run: |
          set -euo pipefail

          # Get workspace ID
          WORKSPACE_ID=$(curl -sf \
            --header "Authorization: Bearer ${TF_API_TOKEN}" \
            --header "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/organizations/${TF_ORG}/workspaces/${TF_WORKSPACE}" \
            | jq -r '.data.id')

          # Get current state version
          STATE_VERSION_ID=$(curl -sf \
            --header "Authorization: Bearer ${TF_API_TOKEN}" \
            --header "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/workspaces/${WORKSPACE_ID}/current-state-version" \
            | jq -r '.data.id')

          # Get outputs from state version
          OUTPUTS=$(curl -sf \
            --header "Authorization: Bearer ${TF_API_TOKEN}" \
            --header "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/state-versions/${STATE_VERSION_ID}/outputs?page%5Bsize%5D=100")

          get_output() {
            local val
            val=$(echo "$OUTPUTS" | jq -r --arg name "$1" '.data[] | select(.attributes.name == $name) | .attributes.value // empty')
            if [[ -z "$val" ]]; then
              echo "::error::Terraform output '$1' not found in state. Run terraform apply on infra-database first."
              exit 1
            fi
            echo "$val"
          }

          echo "IRSA_ROLE_ARN=$(get_output 'billing_service_irsa_role_arn')" >> $GITHUB_OUTPUT
          echo "DYNAMODB_TABLE_BUDGETS=$(get_output 'billing_dynamodb_budgets_table_name')" >> $GITHUB_OUTPUT
          echo "DYNAMODB_TABLE_PAYMENTS=$(get_output 'billing_dynamodb_payments_table_name')" >> $GITHUB_OUTPUT
          echo "SQS_QUEUE_SERVICE_ORDER_EVENTS=$(get_output 'sqs_os_order_events_queue_name')" >> $GITHUB_OUTPUT
          echo "SQS_QUEUE_BILLING_EVENTS=$(get_output 'sqs_billing_events_queue_name')" >> $GITHUB_OUTPUT
          echo "SQS_QUEUE_QUOTE_APPROVED=$(get_output 'sqs_quote_approved_queue_name')" >> $GITHUB_OUTPUT
          echo "SQS_QUEUE_PAYMENT_FAILED=$(get_output 'sqs_payment_failed_queue_name')" >> $GITHUB_OUTPUT

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Create secrets manifest from template
        run: |
          # k8s/secrets.yaml is gitignored; create from template so CD works without committing it
          printf '%s\n' \
            'apiVersion: v1' \
            'kind: Secret' \
            'metadata:' \
            '  name: billing-service-secrets' \
            '  namespace: billing-service' \
            'type: Opaque' \
            'data:' \
            '  _PLACEHOLDER: __PLACEHOLDER_B64__' \
            > k8s/secrets.yaml

      - name: Prepare Kubernetes manifests
        env:
          IRSA_ROLE_ARN: ${{ steps.parsed-outputs.outputs.IRSA_ROLE_ARN }}
          DYNAMODB_TABLE_BUDGETS: ${{ steps.parsed-outputs.outputs.DYNAMODB_TABLE_BUDGETS }}
          DYNAMODB_TABLE_PAYMENTS: ${{ steps.parsed-outputs.outputs.DYNAMODB_TABLE_PAYMENTS }}
          SQS_QUEUE_SERVICE_ORDER_EVENTS: ${{ steps.parsed-outputs.outputs.SQS_QUEUE_SERVICE_ORDER_EVENTS }}
          SQS_QUEUE_BILLING_EVENTS: ${{ steps.parsed-outputs.outputs.SQS_QUEUE_BILLING_EVENTS }}
          SQS_QUEUE_QUOTE_APPROVED: ${{ steps.parsed-outputs.outputs.SQS_QUEUE_QUOTE_APPROVED }}
          SQS_QUEUE_PAYMENT_FAILED: ${{ steps.parsed-outputs.outputs.SQS_QUEUE_PAYMENT_FAILED }}
          IMAGE_URI: ${{ needs.build-and-push.outputs.image-uri }}
        run: |
          set -euo pipefail

          # ConfigMap - table and queue names from Terraform
          sed -i "s|__DYNAMODB_TABLE_BUDGETS__|${DYNAMODB_TABLE_BUDGETS}|g" k8s/configmap.yaml
          sed -i "s|__DYNAMODB_TABLE_PAYMENTS__|${DYNAMODB_TABLE_PAYMENTS}|g" k8s/configmap.yaml
          sed -i "s|__SQS_QUEUE_SERVICE_ORDER_EVENTS__|${SQS_QUEUE_SERVICE_ORDER_EVENTS}|g" k8s/configmap.yaml
          sed -i "s|__SQS_QUEUE_BILLING_EVENTS__|${SQS_QUEUE_BILLING_EVENTS}|g" k8s/configmap.yaml
          sed -i "s|__SQS_QUEUE_QUOTE_APPROVED__|${SQS_QUEUE_QUOTE_APPROVED}|g" k8s/configmap.yaml
          sed -i "s|__SQS_QUEUE_PAYMENT_FAILED__|${SQS_QUEUE_PAYMENT_FAILED}|g" k8s/configmap.yaml

          # ServiceAccount - IRSA role ARN
          sed -i "s|__IRSA_ROLE_ARN__|${IRSA_ROLE_ARN}|g" k8s/service-account.yaml

          # Deployment - image URI
          sed -i "s|__IMAGE_URI__|${IMAGE_URI}|g" k8s/app-deployment.yaml

          # Secrets - placeholder so the Secret resource is valid (Billing uses IRSA, no DB)
          PLACEHOLDER_B64=$(echo -n 'irsa' | base64 -w0 2>/dev/null || echo -n 'irsa' | base64)
          sed -i "s|__PLACEHOLDER_B64__|${PLACEHOLDER_B64}|g" k8s/secrets.yaml

          echo "Kubernetes manifests prepared successfully"

      - name: Deploy to Kubernetes
        id: deploy
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/service-account.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secrets.yaml
          kubectl apply -f k8s/app-deployment.yaml
          kubectl apply -f k8s/app-service.yaml
          kubectl apply -f k8s/hpa.yaml

          kubectl rollout status deployment/billing-service -n billing-service --timeout=600s

      - name: Diagnose rollout failure
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          mkdir -p _rollout-diagnosis
          echo "## Rollout diagnosis (billing-service)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pods" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n billing-service -l app=billing-service -o wide 2>/dev/null | tee -a $GITHUB_STEP_SUMMARY | tee _rollout-diagnosis/pods.txt || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Full diagnosis (download artifact \`rollout-diagnosis\`)" >> $GITHUB_STEP_SUMMARY
          kubectl get events -n billing-service --sort-by='.lastTimestamp' 2>/dev/null | tail -80 > _rollout-diagnosis/events.txt || true
          for POD in $(kubectl get pods -n billing-service -l app=billing-service -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            [[ -z "$POD" ]] && continue
            kubectl logs "$POD" -n billing-service --tail=500 2>/dev/null > "_rollout-diagnosis/logs-${POD}.txt" || true
            kubectl describe pod "$POD" -n billing-service 2>/dev/null > "_rollout-diagnosis/describe-${POD}.txt" || true
          done

      - name: Upload rollout diagnosis artifact
        if: failure() && steps.deploy.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rollout-diagnosis
          path: _rollout-diagnosis/
          retention-days: 7

      - name: Get deployment info
        id: deployment-info
        run: |
          EXTERNAL_HOST=$(kubectl get svc billing-service -n billing-service -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
          if [[ -z "$EXTERNAL_HOST" ]]; then
            EXTERNAL_HOST=$(kubectl get svc billing-service -n billing-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "pending")
          fi
          echo "external-host=${EXTERNAL_HOST}" >> $GITHUB_OUTPUT
          READY_PODS=$(kubectl get pods -n billing-service -l app=billing-service --no-headers 2>/dev/null | grep -c Running || echo "0")
          TOTAL_PODS=$(kubectl get pods -n billing-service -l app=billing-service --no-headers 2>/dev/null | wc -l)
          echo "pods=${READY_PODS}/${TOTAL_PODS}" >> $GITHUB_OUTPUT

      - name: Generate deployment summary
        if: success()
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image-uri }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
          EXTERNAL_HOST: ${{ steps.deployment-info.outputs.external-host }}
          PODS: ${{ steps.deployment-info.outputs.pods }}
        run: |
          BASE_URL="http://${EXTERNAL_HOST}:8080/api/billing-service"
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🚀 Deployment Summary

          | Metric | Value |
          |--------|-------|
          | **Environment** | \`${{ github.event.inputs.environment || 'staging' }}\` |
          | **Image** | \`${IMAGE_TAG}\` |
          | **Pods Ready** | ${PODS} |
          | **Cluster** | \`${{ env.EKS_CLUSTER_NAME }}\` |
          | **Namespace** | \`billing-service\` |

          ### 🔗 API Access

          | Endpoint | URL |
          |----------|-----|
          | **Base URL** | \`${BASE_URL}\` |
          | **Health Check** | \`${BASE_URL}/actuator/health\` |

          ### 📋 Quick Test

          \`\`\`bash
          curl -s ${BASE_URL}/actuator/health | jq .
          \`\`\`

          ---
          *Deployed at $(date -u '+%Y-%m-%d %H:%M:%S UTC') by @${{ github.actor }}*
          EOF

      - name: Rollback on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/billing-service -n billing-service || true
          echo "Deployment failed, attempted rollback to previous version"
